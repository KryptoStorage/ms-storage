services:
  ms-storage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-storage
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      LOG_FORMAT: json
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
