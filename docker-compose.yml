version: '3.8'

services:
  ms-storage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-storage
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
