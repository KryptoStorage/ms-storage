run:
  timeout: 3m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gosec
    - revive
    - misspell
    - bodyclose
    - gocyclo
    - goimports
    - unconvert
    - unparam

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: var-naming
      - name: indent-error-flow
      - name: error-return
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: unused-parameter
      - name: errorf
  gosec:
    excludes:
      - G104 # Audit errors not checked — covered by errcheck.
  goimports:
    local-prefixes: github.com/KryptoStorage/ms-storage

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - gocyclo
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
